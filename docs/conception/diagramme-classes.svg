<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1100" viewBox="0 0 1450 1100"><rect width="1450" height="1100" fill="white"/><g font-family="Arial, sans-serif" fill="#18324a"><text x="60" y="42" font-size="26" text-anchor="start">COV-6 — Diagramme de classes : covoiturage</text><rect x="60" y="90" width="320" height="270" rx="4" fill="#f6f9fc" stroke="#355873" stroke-width="2"/><path d="M 60 134 h 320" stroke="#355873"/><text x="220" y="119" font-size="20" text-anchor="middle">Conducteur</text><text x="75" y="163" font-size="16" text-anchor="start">id : Long</text><text x="75" y="188" font-size="16" text-anchor="start">nom : String</text><text x="75" y="213" font-size="16" text-anchor="start">prenom : String</text><text x="75" y="238" font-size="16" text-anchor="start">email : String {unique}</text><text x="75" y="263" font-size="16" text-anchor="start">telephone : String</text><text x="75" y="288" font-size="16" text-anchor="start">numeroPermis : String {unique}</text><rect x="490" y="90" width="320" height="270" rx="4" fill="#f6f9fc" stroke="#355873" stroke-width="2"/><path d="M 490 134 h 320" stroke="#355873"/><text x="650" y="119" font-size="20" text-anchor="middle">Vehicule</text><text x="505" y="163" font-size="16" text-anchor="start">id : Long</text><text x="505" y="188" font-size="16" text-anchor="start">marque : String</text><text x="505" y="213" font-size="16" text-anchor="start">modele : String</text><text x="505" y="238" font-size="16" text-anchor="start">immatriculation : String {unique}</text><text x="505" y="263" font-size="16" text-anchor="start">couleur : String</text><text x="505" y="288" font-size="16" text-anchor="start">capacite : int {1..8}</text><rect x="1050" y="90" width="320" height="270" rx="4" fill="#f6f9fc" stroke="#355873" stroke-width="2"/><path d="M 1050 134 h 320" stroke="#355873"/><text x="1210" y="119" font-size="20" text-anchor="middle">Passager</text><text x="1065" y="163" font-size="16" text-anchor="start">id : Long</text><text x="1065" y="188" font-size="16" text-anchor="start">nom : String</text><text x="1065" y="213" font-size="16" text-anchor="start">prenom : String</text><text x="1065" y="238" font-size="16" text-anchor="start">email : String</text><text x="1065" y="263" font-size="16" text-anchor="start">telephone : String</text><rect x="60" y="500" width="320" height="270" rx="4" fill="#f6f9fc" stroke="#355873" stroke-width="2"/><path d="M 60 544 h 320" stroke="#355873"/><text x="220" y="529" font-size="20" text-anchor="middle">Trajet</text><text x="75" y="573" font-size="16" text-anchor="start">id : Long</text><text x="75" y="598" font-size="16" text-anchor="start">villeDepart : String</text><text x="75" y="623" font-size="16" text-anchor="start">villeArrivee : String</text><text x="75" y="648" font-size="16" text-anchor="start">dateDepart : LocalDateTime</text><text x="75" y="673" font-size="16" text-anchor="start">placesProposees : int</text><text x="75" y="698" font-size="16" text-anchor="start">statut : StatutTrajet</text><text x="75" y="723" font-size="16" text-anchor="start">/placesRestantes : int {calcule}</text><rect x="490" y="500" width="320" height="270" rx="4" fill="#f6f9fc" stroke="#355873" stroke-width="2"/><path d="M 490 544 h 320" stroke="#355873"/><text x="650" y="529" font-size="20" text-anchor="middle">PointArret</text><text x="505" y="573" font-size="16" text-anchor="start">id : Long</text><text x="505" y="598" font-size="16" text-anchor="start">ville : String</text><text x="505" y="623" font-size="16" text-anchor="start">ordre : int</text><text x="505" y="648" font-size="16" text-anchor="start">heurePassage : LocalDateTime</text><text x="505" y="673" font-size="16" text-anchor="start">prixDepuisDepart : BigDecimal</text><rect x="1050" y="500" width="320" height="270" rx="4" fill="#f6f9fc" stroke="#355873" stroke-width="2"/><path d="M 1050 544 h 320" stroke="#355873"/><text x="1210" y="529" font-size="20" text-anchor="middle">Reservation</text><text x="1065" y="573" font-size="16" text-anchor="start">id : Long</text><text x="1065" y="598" font-size="16" text-anchor="start">nombrePlaces : int</text><text x="1065" y="623" font-size="16" text-anchor="start">montantTotal : BigDecimal</text><text x="1065" y="648" font-size="16" text-anchor="start">dateReservation : LocalDateTime</text><text x="1065" y="673" font-size="16" text-anchor="start">statut : StatutReservation</text><polyline points="380,180 490,180" fill="none" stroke="#355873" stroke-width="2"/><text x="403" y="168" font-size="15" text-anchor="start">1</text><text x="467" y="168" font-size="15" text-anchor="end">0..*</text><text x="435" y="204" font-size="15" text-anchor="middle">possede</text><polyline points="150,360 150,500" fill="none" stroke="#355873" stroke-width="2"/><text x="162" y="384" font-size="15" text-anchor="start">1</text><text x="162" y="488" font-size="15" text-anchor="start">0..*</text><text x="162" y="440" font-size="15" text-anchor="start">publie</text><polyline points="570,360 570,415 300,415 300,500" fill="none" stroke="#355873" stroke-width="2"/><text x="582" y="384" font-size="15" text-anchor="start">1</text><text x="312" y="488" font-size="15" text-anchor="start">0..*</text><text x="425" y="405" font-size="15" text-anchor="start">utilise par</text><polyline points="380,610 490,610" fill="none" stroke="#355873" stroke-width="2"/><polygon points="380,610 390,604 400,610 390,616" fill="#355873"/><text x="403" y="598" font-size="15" text-anchor="start">1</text><text x="467" y="598" font-size="15" text-anchor="end">2..*</text><text x="435" y="634" font-size="15" text-anchor="middle">contient</text><polyline points="1210,360 1210,500" fill="none" stroke="#355873" stroke-width="2"/><text x="1222" y="384" font-size="15" text-anchor="start">1</text><text x="1222" y="488" font-size="15" text-anchor="start">0..*</text><text x="1222" y="440" font-size="15" text-anchor="start">effectue</text><polyline points="220,770 220,885 1210,885 1210,770" fill="none" stroke="#355873" stroke-width="2"/><text x="243" y="758" font-size="15" text-anchor="start">1</text><text x="1187" y="758" font-size="15" text-anchor="end">0..*</text><text x="715" y="794" font-size="15" text-anchor="middle">recoit</text><polyline points="810,580 1050,580" fill="none" stroke="#355873" stroke-width="2"/><text x="833" y="568" font-size="15" text-anchor="start">1</text><text x="1027" y="568" font-size="15" text-anchor="end">0..*</text><text x="930" y="604" font-size="15" text-anchor="middle">montee</text><polyline points="810,690 1050,690" fill="none" stroke="#355873" stroke-width="2"/><text x="833" y="678" font-size="15" text-anchor="start">1</text><text x="1027" y="678" font-size="15" text-anchor="end">0..*</text><text x="930" y="714" font-size="15" text-anchor="middle">descente</text><text x="60" y="940" font-size="16" text-anchor="start">StatutTrajet : PUBLIE | COMPLET | TERMINE | ANNULE</text><text x="60" y="968" font-size="16" text-anchor="start">StatutReservation : CONFIRMEE | ANNULEE</text><text x="60" y="996" font-size="16" text-anchor="start">1 = exactement un ; 0..* = zero ou plusieurs ; 2..* = au moins deux. Losange plein = composition.</text><text x="60" y="1024" font-size="16" text-anchor="start">Un segment = deux points du meme trajet, montee avant descente. Aucune classe Segment.</text><text x="60" y="1052" font-size="16" text-anchor="start">Places restantes calculees sur tout le trajet. Depart/arrivee/date coherents avec les premier/dernier points.</text></g></svg>