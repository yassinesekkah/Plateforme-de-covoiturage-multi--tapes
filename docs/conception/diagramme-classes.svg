Long</text><text x="1065" y="188" font-size="16" text-anchor="start">lastName : String</text><text x="1065" y="213" font-size="16" text-anchor="start">firstName : String</text><text x="1065" y="238" font-size="16" text-anchor="start">email : String {unique}</text><text x="1065" y="263" font-size="16" text-anchor="start">phone : String</text><rect x="60" y="500" width="320" height="270" rx="4" fill="#f6f9fc" stroke="#355873" stroke-width="2"/><path d="M 60 544 h 320" stroke="#355873"/><text x="220" y="529" font-size="20" text-anchor="middle">Trajet</text><text x="75" y="573" font-size="16" text-anchor="start">id : Long</text><text x="75" y="598" font-size="16" text-anchor="start">departureCity : String</text><text x="75" y="623" font-size="16" text-anchor="start">arrivalCity : String</text><text x="75" y="648" font-size="16" text-anchor="start">departureTime : LocalDateTime</text><text x="75" y="673" font-size="16" text-anchor="start">offeredSeats : Integer</text><text x="75" y="698" font-size="16" text-anchor="start">status : StatutTrajet</text><text x="75" y="723" font-size="16" text-anchor="start">/remainingSeats : Integer {calcule}</text><rect x="490" y="500" width="320" height="270" rx="4" fill="#f6f9fc" stroke="#355873" stroke-width="2"/><path d="M 490 544 h 320" stroke="#355873"/><text x="650" y="529" font-size="20" text-anchor="middle">PointArret</text><text x="505" y="573" font-size="16" text-anchor="start">id : Long</text><text x="505" y="598" font-size="16" text-anchor="start">city : String</text><text x="505" y="623" font-size="16" text-anchor="start">stopOrder : Integer</text><text x="505" y="648" font-size="16" text-anchor="start">passageTime : LocalDateTime</text><text x="505" y="673" font-size="16" text-anchor="start">priceFromDeparture : BigDecimal</text><rect x="1050" y="500" width="320" height="270" rx="4" fill="#f6f9fc" stroke="#355873" stroke-width="2"/><path d="M 1050 544 h 320" stroke="#355873"/><text x="1210" y="529" font-size="20" text-anchor="middle">Reservation</text><text x="1065" y="573" font-size="16" text-anchor="start">id : Long</text><text x="1065" y="598" font-size="16" text-anchor="start">nombrePlaces : Integer</text><text x="1065" y="623" font-size="16" text-anchor="start">montantTotal : BigDecimal</text><text x="1065" y="648" font-size="16" text-anchor="start">dateReservation : LocalDateTime</text><text x="1065" y="673" font-size="16" text-anchor="start">statut : StatutReservation</text><polyline points="380,180 490,180" fill="none" stroke="#355873" stroke-width="2"/><text x="403" y="168" font-size="15" text-anchor="start">1</text><text x="467" y="168" font-size="15" text-anchor="end">0..*</text><text x="435" y="204" font-size="15" text-anchor="middle">possede</text><polyline points="150,360 150,500" fill="none" stroke="#355873" stroke-width="2"/><text x="162" y="384" font-size="15" text-anchor="start">1</text><text x="162" y="488" font-size="15" text-anchor="start">0..*</text><text x="162" y="440" font-size="15" text-anchor="start">publie</text><polyline points="570,360 570,415 300,415 300,500" fill="none" stroke="#355873" stroke-width="2"/><text x="582" y="384" font-size="15" text-anchor="start">1</text><text x="312" y="488" font-size="15" text-anchor="start">0..*</text><text x="425" y="405" font-size="15" text-anchor="start">utilise par</text><polyline points="380,610 490,610" fill="none" stroke="#355873" stroke-width="2"/><polygon points="380,610 390,604 400,610 390,616" fill="#355873"/><text x="403" y="598" font-size="15" text-anchor="start">1</text><text x="467" y="598" font-size="15" text-anchor="end">2..*</text><text x="435" y="634" font-size="15" text-anchor="middle">contient</text><polyline points="1210,360 1210,500" fill="none" stroke="#355873" stroke-width="2"/><text x="1222" y="384" font-size="15" text-anchor="start">1</text><text x="1222" y="488" font-size="15" text-anchor="start">0..*</text><text x="1222" y="440" font-size="15" text-anchor="start">effectue</text><polyline points="220,770 220,885 1210,885 1210,770" fill="none" stroke="#355873" stroke-width="2"/><text x="232" y="795" font-size="15" text-anchor="start">1</text><text x="1222" y="795" font-size="15" text-anchor="start">0..*</text><text x="715" y="875" font-size="16" text-anchor="middle">recoit</text><polyline points="810,580 1050,580" fill="none" stroke="#355873" stroke-width="2"/><text x="833" y="568" font-size="15" text-anchor="start">1</text><text x="1027" y="568" font-size="15" text-anchor="end">0..*</text><text x="930" y="604" font-size="15" text-anchor="middle">montee</text><polyline points="810,690 1050,690" fill="none" stroke="#355873" stroke-width="2"/><text x="833" y="678" font-size="15" text-anchor="start">1</text><text x="1027" y="678" font-size="15" text-anchor="end">0..*</text><text x="930" y="714" font-size="15" text-anchor="middle">descente</text><text x="60" y="940" font-size="16" text-anchor="start">StatutTrajet : PUBLIE | COMPLET | TERMINE | ANNULE</text><text x="60" y="968" font-size="16" text-anchor="start">StatutReservation : CONFIRMEE | ANNULEE</text><text x="60" y="996" font-size="16" text-anchor="start">1 = exactement un ; 0..* = zero ou plusieurs ; 2..* = au moins deux (regle du service). Losange plein = composition.</text><text x="60" y="1024" font-size="16" text-anchor="start">Un segment = deux points du meme trajet, montee avant descente. Aucune classe Segment.</text><text x="60" y="1052" font-size="16" text-anchor="start">/remainingSeats : calcule dans le service et expose dans les DTO, aucune colonne dans Trajet.</text></g></svg>